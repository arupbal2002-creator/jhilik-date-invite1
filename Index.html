<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jhilik ❤️</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#fff0f5);
min-height:100vh;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
color:#333;
position:relative;
}

.screen{
display:none;
width:90%;
max-width:550px;
padding:25px;
text-align:center;
animation:fadeIn .6s ease;
}

.active{
display:block;
}

.card{
background:rgba(255,255,255,0.95);
padding:30px;
border-radius:25px;
box-shadow:0 15px 40px rgba(255,105,180,.15);
backdrop-filter:blur(10px);
}

h1{
font-size:2rem;
margin-bottom:15px;
color:#ff4f87;
}

h2{
margin-bottom:15px;
}

p{
line-height:1.6;
}

.subtitle{
margin-bottom:25px;
opacity:.8;
}

button{
border:none;
padding:14px 28px;
margin:10px;
border-radius:40px;
cursor:pointer;
font-size:1rem;
transition:.3s;
}

.yes{
background:#ff4f87;
color:white;
}

.yes:hover{
transform:scale(1.05);
}

.no{
background:white;
border:2px solid #ff4f87;
color:#ff4f87;
}

input[type="date"]{
padding:12px;
font-size:1rem;
border-radius:12px;
border:1px solid #ddd;
margin:20px 0;
width:100%;
}

.option{
background:white;
padding:15px;
margin:12px 0;
border-radius:15px;
border:2px solid #ddd;
cursor:pointer;
transition:.3s;
}

.option.selected{
background:#ff4f87;
color:white;
border-color:#ff4f87;
}

.food-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.food{
background:white;
padding:15px;
border-radius:15px;
border:2px solid #ddd;
cursor:pointer;
transition:.3s;
font-size:.9rem;
}

.food.selected{
background:#ff4f87;
color:white;
border-color:#ff4f87;
}

.instagram-btn{
display:inline-block;
text-decoration:none;
background:#E1306C;
color:white;
padding:14px 24px;
border-radius:30px;
margin-top:20px;
}

.hearts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:-1;
}

.heart{
position:absolute;
font-size:22px;
animation:floatUp linear forwards;
}

@keyframes floatUp{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120px);
opacity:0;
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:600px){

.food-grid{
grid-template-columns:repeat(2,1fr);
}

h1{
font-size:1.7rem;
}

}

</style></head><body><div class="hearts" id="hearts"></div><!-- PAGE 1 --><div class="screen active" id="page1"><div class="card"><h1>Hey Jhilik Dey 🌸</h1><p class="subtitle">
This little website was made just for you ❤️
</p><p>
Someone thinks you're pretty amazing and wanted
to ask you something special...
</p><br><h2>
Would you be interested in a blind date? 💌
</h2><button class="yes" onclick="nextPage(2)">
Yes, I'm Curious ❤️
</button><button class="no" id="noBtn">
Maybe Later 😅
</button></div></div><!-- PAGE 2 --><div class="screen" id="page2"><div class="card"><h1>Pick A Date 📅</h1><p>
When would you be free?
</p><input type="date" id="date"><br><button class="yes" onclick="saveDate()">
Continue ❤️
</button></div></div>
